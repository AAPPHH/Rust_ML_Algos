[package]
name = "my_rust_module"
version = "0.1.0"
edition = "2021"

# [[bin]]
# name = "svm_benchmark"
# path = "src/bin/svm_benchmark.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
rand_distr = "0.4"
numpy = "0.21.0"
rayon = "1.5"
ndarray = { version = "0.15", features = ["rayon"] }
ndarray-parallel = "0.9.1"
faer = { version = "0.22.6", features = ["std"] }
lru = "0.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-native]
inherits = "release"
target-cpu = "native"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
rand_distr = "0.4"

[[bench]]
name = "svm_benchmarks"
path = "benches/svm_benchmark.rs"
harness = false